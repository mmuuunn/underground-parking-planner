version: 0.1
name: underground-parking-basic-planning-harness
product_goal: 공모 기본계획 단계에서 매스별 주차대수와 램프 위치·형식, 차량 순환 가능성을 비교한다.
current_stage: vehicle-circulation
governance_owner: codex
stage_authority: codex
work_item_issuer: codex
implementation_owner: assigned_by_codex
independent_reviewer: assigned_by_codex

authority_rules:
  - 사용자는 제품 방향과 화면 결과를 최종 승인한다
  - Codex만 단계 범위, 작업지시서, 담당 배정, 단계 종료 제안을 바꿀 수 있다
  - Claude는 Codex가 허용한 파일과 합격 조건 안에서만 구현하거나 반례를 검토한다
  - Claude는 목표, 정책, 골든값, 다음 단계를 바꾸지 않는다
  - 상위 판단이 필요하면 NEEDS_AUTHORITY_DECISION으로 Codex에 반환한다
  - Codex도 사용자 승인과 법규 근거를 대신하지 않는다
max_implementation_rounds: 2
max_reviewer_calls: 1
max_changed_files: 5
max_new_production_lines: 400

require_user_gate_when:
  - 주차대수가 바뀐다
  - 램프 위치나 형식이 바뀐다
  - 결과 상태가 FEASIBLE, CONDITIONAL, INFEASIBLE 사이에서 바뀐다
  - 골든케이스 기대값을 바꾸려 한다
  - 사용자가 보는 도면 결과가 바뀐다

require_independent_review_when:
  - 차량, 램프, 구조, 보행, 법규 판정 코드를 바꾼다
  - 골든케이스 기대값을 바꾼다
  - 활성 파일을 5개 이상 바꾼다
  - 같은 결함을 두 번째로 수정한다
  - 단계를 종료하려 한다

stop_when:
  - 같은 원인의 세 번째 수정이 필요하다
  - 골든케이스 둘 이상의 대수가 설명 없이 바뀐다
  - 합격 조건을 바꿔야만 시험이 통과한다
  - 허용 파일 밖 변경이 필요하다
  - 기준 시험을 변경 전 상태에서 재현할 수 없다

never_automatic:
  - 제품 목표 변경
  - 법규 해석 확정
  - 골든케이스 기대 대수 변경
  - 안전 관련 합격 기준 완화
  - 사용자 승인 게이트 제거
  - 모델의 쓰기 권한 확대
  - 비용 한도 확대

principles:
  - 테스트 통과를 건축계획 전체 합격으로 표현하지 않는다
  - 미검증 항목은 미검증으로 남긴다
  - 생성과 독립 판정을 구분한다
  - 화면 설명은 실제 실패 원인과 같은 위치와 번호를 사용한다
  - 상시 감시와 자동 모델 간 왕복을 사용하지 않는다
