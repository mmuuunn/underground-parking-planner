id: vehicle-circulation
name: 차량·램프 신뢰성
status: ACTIVE
user_question: 이 매스에서 차량이 램프에 들어오고 나가며 순환할 수 있는가?

must_answer:
  - 기준 매스별 주차대수와 램프 위치가 재현된다
  - 직선과 곡선 램프를 같은 합류 기준으로 비교한다
  - 급회전과 합류 실패가 실제 위치와 올바른 이유로 표시된다
  - 통과, 실패, 미검증을 구분한다

reference_cases:
  - rectangle
  - l-shape
  - notched
  - narrow-wing
  - all-edge-diagonal
  - pentagon-inner

exit_conditions:
  - 계산 시험이 모두 통과한다
  - 4.7m 안 90도 초과 방향 변화가 정상으로 통과하지 않는다
  - 램프 착지 뒤 6m 합류 조건을 모든 램프 입력에 같은 방식으로 적용한다
  - 실패 위치와 사용자 안내 원인이 일치한다
  - 대수 변화가 있으면 어떤 차로와 칸이 왜 바뀌었는지 설명한다
  - 사용자가 대표 화면을 확인하고 다음 단계 진행을 승인한다

not_in_stage:
  - 코어 UI 확장
  - 보행과 피난 검증
  - 다층 램프
  - 정밀 조향과 교행 시뮬레이션
  - 차량 애니메이션 장식
  - 인허가 수준 법규 판정
