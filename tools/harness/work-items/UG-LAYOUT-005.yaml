experiment_20261028:
  - 변경 전 공통 계산 시험 64개 통과; B 82대 기둥 53개 주 경로 진입 진출 clear 재현
  - 메모리에서 기존 순환선의 윗변과 아랫변을 잇는 직각 차로를 추가하고 기존 기둥 코어 램프를 고정
  - UCS 기준 새 세로 중심선 x는 -14000 -11000 -8000 -5000 -2000mm의 다섯 위치이며 위아래 y는 27600 11200mm
  - x -14000은 89대이나 동선 1구간이 차로 면 밖이고 막다른 칸 8개 및 24제곱미터 빈 섬 발생
  - x -11000과 -8000은 각각 87대이나 기둥 2개가 차로와 겹치고 막다른 칸 7개 발생
  - x -5000은 85대이나 동선 2구간이 차로 면 밖이고 막다른 칸 5개 발생
  - x -2000은 84대이고 막다른 끝은 없으나 기둥 2개가 차로와 겹침
  - 다섯 안 모두 주 경로 진입과 진출 clear이나 새 차로의 실제 차량 주행과 칸별 입출차 교행은 미검증
  - 차로 면 밖 판정 위치와 램프 몸체가 겹치는 예가 있어 새 연결 차로와 램프 몸체의 간섭을 재검토해야 함
  - 자동 DA PIT 제안 합계는 기준 약 1208.8제곱미터 대비 각 약 984.1 1030.5 1048.5 1085.6 1130.4제곱미터
  - 다섯 후보는 모두 새 안전 또는 연결 문제를 만들어 채택하지 않음; 다른 형태나 모든 위치에 대한 불가능의 증거는 아님
  - 실험 스크립트와 원시 결과는 해당 하네스 실행 폴더에 보관하며 Git에 포함되지 않음
remaining:
  - 램프 몸체를 피하는 연결 구조와 기존 기둥 사이 차로 확보 가능성을 먼저 검토
  - 유효한 후보가 있으면 입력 불변성 새 차로 전체 폭 연결 회전과 칸 접근을 별도로 검증
  - 제품 반영과 사용자 수용 독립 검토는 진행하지 않음
